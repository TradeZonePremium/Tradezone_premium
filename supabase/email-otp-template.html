<!--
Supabase Dashboard -> Authentication -> Emails (Templates)

Paste this SAME body into BOTH templates:
  1. "Confirm signup"  (sent to NEW customers)
  2. "Magic Link"      (sent to RETURNING customers / renewals / admin)

Subject:  Your Trade Zone Premium verification code

The important part is {{ .Token }} - that is the OTP code.
Do not include {{ .ConfirmationURL }}.
-->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:auto;padding:24px;color:#10231F">
  <h2 style="margin:0 0 12px">Trade Zone Premium</h2>
  <p>Use this code to verify your email:</p>
  <p style="font-size:32px;letter-spacing:6px;font-weight:bold;margin:16px 0">{{ .Token }}</p>
  <p style="color:#5b6b66;font-size:13px">The code expires soon. If you did not request it, you can ignore this email.</p>
</div>
